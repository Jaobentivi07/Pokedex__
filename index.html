<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="./favicons/favicon-16x16.png">
  <link rel="stylesheet" href="./css/style.css">


  <script defer src="./js/script.js"></script>
  <title>Pokedex</title>
</head>
<body>
  


  <main>
    <img src="#" alt="pokemon" class="pokemon__image">     
    <h1 class="pokemon__data">
      <span class="pokemon__number"></span> -
      <span class="pokemon__name"></span>
    </h1>

    <form class="form">
      <input 
      type="search"
      class="input__search"
      placeholder="Name or Number"
      required
      />
    </form>

    <div class="buttons">
      <button class="button btn-prev">Prev &lt;</button>
      <button class="button btn-next">Next &gt;</button>
    </div>

    <img src="./images/pokedex.png" alt="pokedex" class="pokedex">
  </main>

  <audio id="musica" src="pokemon.mp3" loop></audio>

  <script>
    const musica = document.getElementById("musica");

    // Tenta tocar assim que a página abre
    musica.play().catch(() => {
      // Se o navegador bloquear, toca no primeiro clique/toque
      const iniciar = () => {
        musica.play();
        document.removeEventListener("click", iniciar);
        document.removeEventListener("touchstart", iniciar);
      };
      document.addEventListener("click", iniciar);
      document.addEventListener("touchstart", iniciar);
    });
  </script>
</body>
</html>
